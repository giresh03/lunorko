<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lunor — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 20%, #1a1a2e, #0b0b12 70%);
        color: #e8e8f2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card { max-width: 420px; padding: 40px 28px; }
      h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: -0.02em; }
      p { color: #a0a0b8; line-height: 1.6; font-size: 14px; margin: 0 0 24px; }
      button {
        background: linear-gradient(135deg, #6366f1, #e11d48); color: #fff; border: 0;
        padding: 11px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      .dot { width: 8px; height: 8px; border-radius: 99px; background: #e11d48; display: inline-block; margin-right: 8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><span class="dot"></span>You're offline</h1>
      <p>
        Lunor needs an internet connection for the AI workspace, live previews and your saved
        projects. Reconnect and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
